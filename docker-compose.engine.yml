# stugan + stugan-engine: IRC stays connected across stugan upgrades.
#
#   echo "STUGAN_ENGINE_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose -f docker-compose.engine.yml up -d
#
# Upgrading is then the usual `docker compose -f docker-compose.engine.yml
# pull && … up -d`: only `stugan` is recreated, and it re-attaches to the IRC
# sockets the engine kept open — same nick, same channels, nothing
# re-registers, and what was said meanwhile is delivered when it comes back.
#
# ⚠ The engine image is pinned to `engine-1`, NOT `latest`. Compose recreates
# every service whose image changed; on `latest` each stugan release would
# restart the engine too and drop IRC — the thing it exists to prevent.
# `engine-1` moves only when the engine itself changes (the changelog says
# so), and the `1` is the protocol major: a stugan that needs `engine-2` will
# say so and refuses to talk to an `engine-1`.
#
# Already running stugan? Don't switch to this file from another directory:
# compose names volumes after the project directory, so you'd start on an
# empty one. Add the engine to your existing compose file instead; see
# "Docker" in docs/engine.md for the exact lines.
#
# See docs/engine.md for details, opting in/out, and bare-metal setups.

services:
  stugan:
    image: ghcr.io/klppl/stugan:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - stugan-data:/data
    environment:
      # The presence of this variable IS the feature switch.
      STUGAN_ENGINE_URL: tcp://stugan-engine:8016
      STUGAN_ENGINE_SECRET: ${STUGAN_ENGINE_SECRET:?set STUGAN_ENGINE_SECRET in .env (openssl rand -hex 32)}
    depends_on:
      stugan-engine:
        condition: service_healthy

  stugan-engine:
    image: ${STUGAN_ENGINE_IMAGE:-ghcr.io/klppl/stugan:engine-1}
    restart: unless-stopped
    # No volumes: the engine stores nothing. No published ports: :8016 exists
    # only on the compose network.
    environment:
      STUGAN_ENGINE_SECRET: ${STUGAN_ENGINE_SECRET:?set STUGAN_ENGINE_SECRET in .env (openssl rand -hex 32)}
      # Required in a container: the default loopback bind is unreachable
      # from the stugan container.
      STUGAN_ENGINE_LISTEN: 0.0.0.0:8016
      # Optional tuning (bytes / Go duration); empty means the default.
      STUGAN_ENGINE_BUFFER_BYTES: ${STUGAN_ENGINE_BUFFER_BYTES:-}
      STUGAN_ENGINE_BUFFER_TOTAL_BYTES: ${STUGAN_ENGINE_BUFFER_TOTAL_BYTES:-}
      STUGAN_ENGINE_ORPHAN_TIMEOUT: ${STUGAN_ENGINE_ORPHAN_TIMEOUT:-}
    healthcheck:
      test: ["CMD", "/app/stugan-engine", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  stugan-data:
