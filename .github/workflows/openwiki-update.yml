name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Full history is required so OpenWiki can diff HEAD against the last documented commit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki & Mermaid Validators
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki Update
        env:
          OPENWIKI_PROVIDER: ${{ secrets.OPENWIKI_PROVIDER || 'copilot' }}
          OPENWIKI_MODEL_ID: ${{ secrets.OPENWIKI_MODEL_ID || 'gpt-4o' }}
          COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: openwiki code --update -p
